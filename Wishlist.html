<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist - AgriCulture</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcfdfc;
            color: #333;
        }

        /* Navbar */
        .store-navbar {
            background-color: #fff;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eaeaea;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.4rem;
            font-weight: 700;
            text-decoration: none;
            color: #333;
        }

        .brand-logo i {
            color: #198754;
        }

        .nav-links {
            display: flex;
            gap: 24px;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            color: #555;
            transition: color 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #198754;
        }

        .search-bar-container {
            position: relative;
            width: 250px;
        }

        .search-bar-container input {
            width: 100%;
            padding: 8px 36px 8px 16px;
            border-radius: 4px;
            border: 1px solid #ddd;
            outline: none;
            font-size: 0.85rem;
        }

        .search-bar-container i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .nav-icons {
            display: flex;
            align-items: center;
            gap: 20px;
            color: #555;
            font-size: 1.25rem;
        }

        .cart-icon {
            position: relative;
        }

        .cart-icon .badge {
            position: absolute;
            top: -8px;
            right: -10px;
            background-color: #198754;
            color: white;
            font-size: 0.6rem;
            padding: 2px 5px;
            border-radius: 50%;
        }

        /* Main Content */
        .main-content {
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 32px;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .page-header p {
            font-size: 1rem;
            color: #666;
            margin: 0;
        }

        /* Wishlist Grid */
        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            border: 1px solid #eaeaea;
            overflow: hidden;
            transition: all 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }

        .product-image {
            height: 200px;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .product-image i {
            font-size: 4rem;
            color: #198754;
        }

        .wishlist-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: white;
            border: 1px solid #eaeaea;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .wishlist-btn:hover {
            background-color: #fee;
            border-color: #dc3545;
        }

        .wishlist-btn i {
            color: #dc3545;
        }

        .product-details {
            padding: 20px;
        }

        .product-category {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: #198754;
            margin-bottom: 16px;
        }

        .btn-move-cart {
            width: 100%;
            padding: 12px;
            background-color: #198754;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-move-cart:hover {
            background-color: #146c43;
        }

        .btn-remove {
            width: 100%;
            padding: 10px;
            background-color: transparent;
            color: #dc3545;
            border: 1px solid #dc3545;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .btn-remove:hover {
            background-color: #fee;
        }

        /* Empty State */
        .empty-wishlist {
            text-align: center;
            padding: 80px 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            border: 1px solid #eaeaea;
        }

        .empty-wishlist i {
            font-size: 4rem;
            color: #ddd;
            margin-bottom: 24px;
        }

        .empty-wishlist h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 12px;
        }

        .empty-wishlist p {
            font-size: 1rem;
            color: #666;
            margin-bottom: 24px;
        }

        .btn-browse {
            background-color: #198754;
            color: white;
            padding: 12px 32px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-browse:hover {
            background-color: #146c43;
        }

        @media (max-width: 1200px) {
            .wishlist-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 992px) {
            .store-navbar {
                padding: 16px 20px;
            }

            .nav-links {
                display: none;
            }

            .main-content {
                padding: 20px;
            }

            .wishlist-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 576px) {
            .wishlist-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Store Navbar -->
    <header class="store-navbar">
        <a href="#" class="brand-logo">
            <i class="fa-solid fa-leaf"></i> <span>AgriCulture</span>
        </a>

        <div class="nav-links">
            <a href="#" class="active">Home</a>
            <a href="#">Plants</a>
            <a href="#">Seeds</a>
            <a href="#">Pots & Planters</a>
            <a href="#">Tools</a>
            <a href="#">Plant Care</a>
            <a href="#">Offers</a>
        </div>

        <div class="search-bar-container">
            <input type="text" placeholder="Search plants, seeds..." />
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>

        <div class="nav-icons">
            <a href="#" class="text-reset"><i class="fa-solid fa-heart" style="color: #198754;"></i></a>
            <a href="#" class="text-reset cart-icon">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="badge">2</span>
            </a>
            <a href="#" class="text-reset"><i class="fa-regular fa-user"></i></a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="page-header">
            <h1>My Wishlist</h1>
            <p>4 items saved</p>
        </div>

        <!-- Wishlist Grid -->
        <div class="wishlist-grid">
            <!-- Product 1 -->
            <div class="product-card">
                <div class="product-image">
                    <i class="fa-solid fa-plant-wilt"></i>
                    <button class="wishlist-btn">
                        <i class="fa-solid fa-heart"></i>
                    </button>
                </div>
                <div class="product-details">
                    <div class="product-category">Plants</div>
                    <h3 class="product-name">Areca Palm</h3>
                    <div class="product-price">₹699</div>
                    <button class="btn-move-cart">
                        <i class="fa-solid fa-cart-shopping"></i>
                        Move to Cart
                    </button>
                    <button class="btn-remove">Remove</button>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="product-card">
                <div class="product-image">
                    <i class="fa-solid fa-seedling"></i>
                    <button class="wishlist-btn">
                        <i class="fa-solid fa-heart"></i>
                    </button>
                </div>
                <div class="product-details">
                    <div class="product-category">Plants</div>
                    <h3 class="product-name">Succulent Mix (Pack of 3)</h3>
                    <div class="product-price">₹449</div>
                    <button class="btn-move-cart">
                        <i class="fa-solid fa-cart-shopping"></i>
                        Move to Cart
                    </button>
                    <button class="btn-remove">Remove</button>
                </div>
            </div>

            <!-- Product 3 -->
            <div class="product-card">
                <div class="product-image">
                    <i class="fa-solid fa-bucket"></i>
                    <button class="wishlist-btn">
                        <i class="fa-solid fa-heart"></i>
                    </button>
                </div>
                <div class="product-details">
                    <div class="product-category">Pots & Planters</div>
                    <h3 class="product-name">Self Watering Pot-White</h3>
                    <div class="product-price">₹299</div>
                    <button class="btn-move-cart">
                        <i class="fa-solid fa-cart-shopping"></i>
                        Move to Cart
                    </button>
                    <button class="btn-remove">Remove</button>
                </div>
            </div>

            <!-- Product 4 -->
            <div class="product-card">
                <div class="product-image">
                    <i class="fa-solid fa-leaf"></i>
                    <button class="wishlist-btn">
                        <i class="fa-solid fa-heart"></i>
                    </button>
                </div>
                <div class="product-details">
                    <div class="product-category">Plants</div>
                    <h3 class="product-name">Monstera Deliciosa</h3>
                    <div class="product-price">₹899</div>
                    <button class="btn-move-cart">
                        <i class="fa-solid fa-cart-shopping"></i>
                        Move to Cart
                    </button>
                    <button class="btn-remove">Remove</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
