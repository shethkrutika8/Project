<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Admin - AgriCulture</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }

        /* Navbar */
        .navbar {
            background-color: white;
            padding: 16px 40px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border-bottom: 1px solid #eaeaea;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #198754;
            text-decoration: none;
        }

        .navbar-brand i {
            font-size: 1.8rem;
        }

        .navbar-nav {
            display: flex;
            gap: 32px;
            align-items: center;
        }

        .nav-link {
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            color: #555;
            transition: color 0.2s;
        }

        .nav-link:hover,
        .nav-link.active {
            color: #198754;
        }

        .nav-link.sign-out {
            color: #dc3545;
        }

        .btn-get-started {
            background-color: #198754;
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn-get-started:hover {
            background-color: #146c43;
            color: white;
        }

        /* Main Content */
        .main-content {
            padding: 40px;
            max-width: 900px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 32px;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .page-header p {
            font-size: 1rem;
            color: #666;
            margin: 0;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            font-size: 0.9rem;
        }

        .breadcrumb a {
            color: #198754;
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .breadcrumb span {
            color: #999;
        }

        /* Form Card */
        .form-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            border: 1px solid #eaeaea;
            overflow: hidden;
        }

        .card-header {
            padding: 24px;
            border-bottom: 1px solid #eaeaea;
        }

        .card-header h3 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #333;
            margin: 0;
        }

        .card-body {
            padding: 32px;
        }

        .form-section {
            margin-bottom: 32px;
        }

        .form-section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #eaeaea;
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }

        .form-control {
            padding: 12px 16px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #333;
        }

        .form-control:focus {
            border-color: #198754;
            box-shadow: 0 0 0 3px rgba(25, 135, 84, 0.1);
        }

        .form-control::placeholder {
            color: #aaa;
        }

        .form-select {
            padding: 12px 16px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #333;
        }

        .form-select:focus {
            border-color: #198754;
            box-shadow: 0 0 0 3px rgba(25, 135, 84, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        /* Permissions */
        .permissions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .permission-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .permission-item:hover {
            background-color: #f8f9fa;
            border-color: #198754;
        }

        .permission-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #198754;
            cursor: pointer;
        }

        .permission-item label {
            font-size: 0.9rem;
            color: #555;
            cursor: pointer;
            margin: 0;
            flex: 1;
        }

        /* Buttons */
        .card-footer {
            padding: 24px 32px;
            border-top: 1px solid #eaeaea;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            background-color: #f8f9fa;
        }

        .btn-cancel {
            background-color: white;
            color: #555;
            padding: 12px 32px;
            border-radius: 8px;
            border: 1px solid #d0d7de;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cancel:hover {
            background-color: #f5f7fa;
            border-color: #999;
        }

        .btn-create {
            background-color: #198754;
            color: white;
            padding: 12px 32px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-create:hover {
            background-color: #146c43;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 16px 20px;
            }

            .navbar-nav {
                display: none;
            }

            .main-content {
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .permissions-grid {
                grid-template-columns: 1fr;
            }

            .card-footer {
                flex-direction: column;
            }

            .btn-cancel,
            .btn-create {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="d-flex align-items-center justify-content-between w-100">
            <a href="#" class="navbar-brand">
                <i class="fa-solid fa-leaf"></i>
                <span>AgriCulture</span>
            </a>
            
            <div class="navbar-nav">
                <a href="#" class="nav-link">Dashboard</a>
                <a href="#" class="nav-link">Plants</a>
                <a href="#" class="nav-link">AI Diagnose</a>
                <a href="#" class="nav-link">Users</a>
                <a href="#" class="nav-link">Content</a>
                <a href="#" class="nav-link">Orders</a>
                <a href="#" class="nav-link active">Admin</a>
                <a href="#" class="nav-link sign-out">Sign Out</a>
            </div>

            <a href="#" class="btn-get-started">Get Started</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="breadcrumb">
            <a href="#">Admin</a>
            <span>/</span>
            <a href="#">Manage Admins</a>
            <span>/</span>
            <span>Add New Admin</span>
        </div>

        <div class="page-header">
            <h1>Add New Admin</h1>
            <p>Fill in the details below to create a new admin account</p>
        </div>

        <!-- Form Card -->
        <div class="form-card">
            <div class="card-header">
                <h3>Admin Information</h3>
            </div>

            <div class="card-body">
                <form>
                    <!-- Admin Information Section -->
                    <div class="form-section">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" placeholder="Enter full name" />
                            </div>
                            <div class="form-group">
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-control" placeholder="Enter email address" />
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Role</label>
                                <select class="form-select">
                                    <option value="">Select role</option>
                                    <option value="super-admin">Super Admin</option>
                                    <option value="admin">Admin</option>
                                    <option value="moderator">Moderator</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" placeholder="Enter phone number" />
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" placeholder="Enter password" />
                            </div>
                            <div class="form-group">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" placeholder="Confirm password" />
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Status</label>
                            <select class="form-select">
                                <option value="">Select status</option>
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                    </div>

                    <!-- Permissions Section -->
                    <div class="form-section">
                        <h4 class="section-title">Permissions</h4>
                        <div class="permissions-grid">
                            <div class="permission-item">
                                <input type="checkbox" id="perm1" checked />
                                <label for="perm1">Dashboard Access</label>
                            </div>
                            <div class="permission-item">
                                <input type="checkbox" id="perm2" checked />
                                <label for="perm2">User Management</label>
                            </div>
                            <div class="permission-item">
                                <input type="checkbox" id="perm3" checked />
                                <label for="perm3">Plant Management</label>
                            </div>
                            <div class="permission-item">
                                <input type="checkbox" id="perm4" />
                                <label for="perm4">AI Diagnose Access</label>
                            </div>
                            <div class="permission-item">
                                <input type="checkbox" id="perm5" />
                                <label for="perm5">Content Management</label>
                            </div>
                            <div class="permission-item">
                                <input type="checkbox" id="perm6" />
                                <label for="perm6">Order Management</label>
                            </div>
                            <div class="permission-item">
                                <input type="checkbox" id="perm7" />
                                <label for="perm7">Reports Access</label>
                            </div>
                            <div class="permission-item">
                                <input type="checkbox" id="perm8" />
                                <label for="perm8">Settings Access</label>
                            </div>
                            <div class="permission-item">
                                <input type="checkbox" id="perm9" />
                                <label for="perm9">Send Notifications</label>
                            </div>
                            <div class="permission-item">
                                <input type="checkbox" id="perm10" />
                                <label for="perm10">View System Logs</label>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <div class="card-footer">
                <button type="button" class="btn-cancel">Cancel</button>
                <button type="submit" class="btn-create">Create Admin</button>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
